post:
  tags:
    - Orders
  summary: Capturar ordem autorizada
  description: Captura uma ordem que foi previamente autorizada
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID da ordem no Mercado Pago
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            amount:
              type: number
              format: float
              description: Valor a capturar (opcional, se omitido captura o valor total)
              example: 150.50
  responses:
    '200':
      description: Ordem capturada com sucesso
      content:
        application/json:
          schema:
            type: object
            properties:
              order:
                $ref: '#/components/schemas/Order'
              message:
                type: string
                example: "Ordem capturada com sucesso"
    '400':
      description: Ordem não pode ser capturada
    '404':
      description: Ordem não encontrada
    '401':
      description: Não autenticado
    '500':
      description: Erro interno do servidor

