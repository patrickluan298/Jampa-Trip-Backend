put:
  tags:
    - Orders
  summary: Atualizar transação
  description: Atualiza os dados de uma transação existente
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID da ordem no Mercado Pago
    - name: transaction_id
      in: path
      required: true
      schema:
        type: integer
      description: ID da transação
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              enum: [pending, approved, authorized, rejected, cancelled, refunded]
              example: "approved"
            status_detail:
              type: string
              example: "accredited"
            amount:
              type: number
              format: float
              example: 150.50
  responses:
    '200':
      description: Transação atualizada com sucesso
      content:
        application/json:
          schema:
            type: object
            properties:
              transaction:
                $ref: '#/components/schemas/Transaction'
              message:
                type: string
                example: "Transação atualizada com sucesso"
    '400':
      description: Erro de validação
    '404':
      description: Transação não encontrada
    '401':
      description: Não autenticado
    '500':
      description: Erro interno do servidor

delete:
  tags:
    - Orders
  summary: Deletar transação
  description: Remove uma transação de uma ordem
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID da ordem no Mercado Pago
    - name: transaction_id
      in: path
      required: true
      schema:
        type: integer
      description: ID da transação
  responses:
    '200':
      description: Transação deletada com sucesso
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Transação deletada com sucesso"
    '404':
      description: Transação não encontrada
    '401':
      description: Não autenticado
    '500':
      description: Erro interno do servidor

