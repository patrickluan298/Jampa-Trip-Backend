post:
  tags:
    - Orders
  summary: Adicionar transação à ordem
  description: Adiciona uma nova transação de pagamento a uma ordem existente
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID da ordem no Mercado Pago
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - payment_id
            - payment_method_id
            - amount
            - currency
          properties:
            payment_id:
              type: integer
              example: 123456789
              description: ID do pagamento no Mercado Pago
            payment_method_id:
              type: string
              example: "visa"
              description: Método de pagamento usado
            amount:
              type: number
              format: float
              example: 150.50
              description: Valor da transação
            currency:
              type: string
              example: "BRL"
              description: Moeda da transação
  responses:
    '201':
      description: Transação adicionada com sucesso
      content:
        application/json:
          schema:
            type: object
            properties:
              transaction:
                $ref: '#/components/schemas/Transaction'
              order:
                $ref: '#/components/schemas/Order'
              message:
                type: string
                example: "Transação adicionada com sucesso"
    '400':
      description: Erro de validação
    '404':
      description: Ordem não encontrada
    '401':
      description: Não autenticado
    '500':
      description: Erro interno do servidor

